# Hosted pilot static server. The demo store is a test site, not for search engines.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # The built SDK bundle (sdk/dist), mounted outside the read-only demo-store root.
  location /sdk/ {
    alias /usr/share/nginx/sdk/;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
