# Dev only. Config is re-fetched on every load and readable cross-origin.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /config/ {
    alias /usr/share/nginx/config/;
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";
    default_type application/json;
  }

  # The built SDK bundle (sdk/dist), mounted outside the read-only demo-store root.
  location /sdk/ {
    alias /usr/share/nginx/sdk/;
    add_header Cache-Control "no-store";
  }
}
