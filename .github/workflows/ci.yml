# Intended replacement for .github/workflows/ci.yml. It could not be pushed from the build
# machine because the GitHub token has no `workflow` scope (NOTES.md B1). To apply:
#   gh auth refresh -s workflow
#   cp docs/ci.pending.yml .github/workflows/ci.yml && git add -A && git commit && git push
name: ci
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ivay
          POSTGRES_PASSWORD: ivay_dev
          POSTGRES_DB: ivay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ivay -d ivay_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ivay:ivay_dev@localhost:5432/ivay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: api/pyproject.toml }
      - run: pip install -e "api[dev]"
      - run: cd api && ruff check . ../scripts && mypy app tests
      - run: cd api && pytest -q

  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sdk/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build && node scripts/size.mjs

  analysis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ivay
          POSTGRES_PASSWORD: ivay_dev
          POSTGRES_DB: ivay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ivay -d ivay_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ivay:ivay_dev@localhost:5432/ivay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "api[dev]" -e "analysis[dev]"
      - run: cd analysis && ruff check . && mypy ivay_analysis tests
      - run: cd analysis && pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose up -d --build --wait
      - run: curl -fsS localhost:8000/health && curl -fsS localhost:8080/config/shop_dev.json >/dev/null
      - run: docker compose down -v

  # The real SDK bundle in Chromium against the demo store, the API and Postgres (make e2e).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: api/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -e "api[dev]"
      - run: cd sdk && npm ci && npm run build
      - run: docker compose up -d --build --wait
      - run: python scripts/seed_dev.py
        env: { DATABASE_URL: "postgresql+asyncpg://ivay:ivay_dev@127.0.0.1:5432/ivay", API_PORT: "8000" }
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test
        env: { API_PORT: "8000" }
      - run: docker compose down -v
        if: always()
