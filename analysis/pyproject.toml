[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivay-analysis"
version = "0.0.0"
description = "Ivay Phase 0 gate report: reads the session_rollup view, computes the eight gate numbers"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["ivay_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"  # numpy 2.4 stubs use PEP 695 syntax
strict = true
mypy_path = "../scripts:../api"

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
